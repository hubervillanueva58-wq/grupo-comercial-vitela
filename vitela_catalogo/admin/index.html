<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Admin — Grupo Comercial Vitela</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">GRUPO COMERCIAL VITELA</div>
        <h1>Administración de catálogo</h1>
        <p id="sessionStatus" class="muted">Verificando acceso…</p>
      </div>
      <a class="btn ghost" href="/" rel="noopener">Ver sitio</a>
    </header>

    <section id="app" class="hidden" aria-live="polite">
      <div class="toolbar">
        <div>
          <h2>Menudeo</h2>
          <p class="muted">Edita precio, stock, descripción y visibilidad. Las imágenes siguen vinculadas por SKU.</p>
        </div>
        <div class="toolbar-actions">
          <input id="search" type="search" autocomplete="off" placeholder="Buscar SKU, modelo o color" maxlength="80">
          <button id="newProduct" class="btn primary" type="button">Nuevo producto</button>
        </div>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>SKU</th><th>Producto</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="editor" class="dialog">
    <form id="productForm" method="dialog" novalidate>
      <div class="dialog-head">
        <div><div class="eyebrow">PRODUCTO</div><h2 id="formTitle">Nuevo producto</h2></div>
        <button id="closeDialog" class="icon-btn" type="button" aria-label="Cerrar">×</button>
      </div>
      <div class="grid">
        <label>SKU <input id="sku" name="sku" required maxlength="48" pattern="[A-Za-z0-9_-]{3,48}"></label>
        <label>Modelo <input id="modelo" name="modelo" required maxlength="80"></label>
        <label>Tamaño (oz) <input id="tam" name="tam" required inputmode="numeric" type="number" min="1" max="999"></label>
        <label>Color <input id="color" name="color" required maxlength="50"></label>
        <label>Precio (MXN) <input id="precio" name="precio" required inputmode="decimal" type="number" min="0" max="1000000" step="0.01"></label>
        <label>Stock <input id="stock" name="stock" required inputmode="numeric" type="number" min="0" max="1000000" step="1"></label>
        <label class="full">Descripción <textarea id="descripcion" name="descripcion" maxlength="1000" rows="4"></textarea></label>
        <label class="full inline"><input id="activo" type="checkbox" checked> Producto visible en el catálogo</label>
      </div>
      <div class="dialog-actions">
        <button id="cancel" class="btn ghost" type="button">Cancelar</button>
        <button class="btn primary" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
